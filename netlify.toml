[build]
  command = "npm run build"
  publish = "www"

[build.environment]
  NODE_VERSION = "22.13.0"

# Dedicated preview: deployment stays blocked until the site owner opts in.
# NEON_PREVIEW_DEPLOY=1 must be set explicitly for this branch in Netlify.
[context.continuity-assets-audit-20261013]
  ignore = "node ./scripts/netlify-preview-gate.mjs --ignore"
  command = "node ./scripts/netlify-preview-gate.mjs --require-enabled && npm run build:preview && npm run test:static && npm run test:preview"
  publish = "preview-dist"

# Each publish directory supplies its own _headers. The ordinary build copies
# the existing root _headers unchanged; preview-dist supplies its isolated policy.
# Do not duplicate headers here: TOML values would override the preview policy.
