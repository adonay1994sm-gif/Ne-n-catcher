[build]
  command = "npm run build"
  publish = "www"

[build.environment]
  NODE_VERSION = "22.13.0"

# Dedicated preview: deployment stays blocked until the site owner opts in.
# NEON_PREVIEW_DEPLOY=1 must be set explicitly for this branch in Netlify.
[context.continuity-assets-audit-20261013]
  ignore = "node ./scripts/netlify-preview-gate.mjs --ignore"
  command = "node ./scripts/netlify-preview-gate.mjs --require-enabled && npm run build:preview"
  publish = "preview-dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
