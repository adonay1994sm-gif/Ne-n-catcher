name: NEON CATCHER Art Pass A QA

on:
  push:
    branches: [visual-artpass-a-2026-10-13]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore missing native iOS art from approved in-repo artwork
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/generate-ios-art.py
      - name: Commit generated iOS assets on this isolated branch
        run: |
          git add ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png
          git add ios/App/App/Assets.xcassets/Splash.imageset/*.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "art(ios): restore native images from canonical NEON assets"
            git push origin HEAD:visual-artpass-a-2026-10-13
          fi
      - name: Clean install
        run: npm ci
      - name: Build game and web bundle
        run: npm run build
      - name: Original functional regression tests
        run: npm test
      - name: Static and asset-integrity tests
        run: npm run test:static
      - name: Architecture regression tests
        run: npm run test:architecture
      - name: Engine and visual artpass unit tests
        run: node --test tests/*.test.mjs
      - name: Verify built visual preview files exist
        run: |
          test -s www/index.html
          test -s www/game.js
          test -s www/assets/cronos_level1_background.webp
          test -s www/assets/shield_effect.webp
